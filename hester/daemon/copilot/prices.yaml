# Lee's price table (docs/15-Usage.md §8): USD per million tokens.
#
# Needed for Hester's Gemini calls (the response has tokens, not dollars) and
# as the fallback for Claude sessions that never reported a status line.
# Override or extend in ~/.lee/config.yaml under usage.prices, by model id:
#
#   usage:
#     prices:
#       gemini-3.1-pro-preview: { input: 2.00, output: 12.00, cache_read: 0.20 }
#
# Keys are exact model ids (a "models/" prefix and a -YYYYMMDD date suffix are
# ignored when matching). A model missing here gets tokens but no cost: never
# a guessed price. A missing cache_read / cache_write price charges those
# tokens at the input price. The provider grouping is for reading only.
#
# Gemini prices are the standard (<= 200k prompt) tier.

google:
  gemini-2.0-flash:       { input: 0.10, output: 0.40, cache_read: 0.025 }
  gemini-2.0-flash-lite:  { input: 0.075, output: 0.30 }
  gemini-2.5-flash:       { input: 0.30, output: 2.50, cache_read: 0.03 }
  gemini-2.5-flash-lite:  { input: 0.10, output: 0.40, cache_read: 0.01 }
  gemini-2.5-pro:         { input: 1.25, output: 10.00, cache_read: 0.125 }
  gemini-3-flash-preview: { input: 0.50, output: 3.00, cache_read: 0.05 }
  gemini-3-pro-preview:   { input: 2.00, output: 12.00, cache_read: 0.20 }
  gemini-embedding-001:   { input: 0.15, output: 0.0 }

anthropic:
  # cache_write is the 5-minute write (1.25x input).
  claude-fable-5-1:  { input: 10.00, output: 50.00, cache_read: 0.25, cache_write: 12.50 }
  claude-fable-5:    { input: 10.00, output: 50.00, cache_read: 1.00, cache_write: 12.50 }
  claude-opus-5-5:   { input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00 }
  claude-opus-5:     { input: 5.00, output: 25.00, cache_read: 0.50, cache_write: 6.25 }
  claude-opus-4-8:   { input: 5.00, output: 25.00, cache_read: 0.50, cache_write: 6.25 }
  claude-opus-4-7:   { input: 5.00, output: 25.00, cache_read: 0.50, cache_write: 6.25 }
  claude-opus-4-6:   { input: 5.00, output: 25.00, cache_read: 0.50, cache_write: 6.25 }
  claude-sonnet-5:   { input: 2.00, output: 10.00, cache_read: 0.20, cache_write: 2.50 }
  claude-sonnet-4-6: { input: 3.00, output: 15.00, cache_read: 0.30, cache_write: 3.75 }
  claude-haiku-4-5:  { input: 1.00, output: 5.00, cache_read: 0.10, cache_write: 1.25 }
