name: aeronaut
description: "Aeronaut - Lee's mobile companion. Native mobile access to your IDE."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.9

  # State management
  flutter_riverpod: ^2.6.1

  # Models
  equatable: ^2.1.0

  # Networking
  http: ^1.1.0
  web_socket_channel: ^3.0.3

  # Storage
  shared_preferences: ^2.5.5

  # URL launching
  url_launcher: ^6.2.1

  # Terminal emulator
  xterm: ^4.0.0

  # Utils
  uuid: ^4.6.0

  # Markdown (flutter_markdown is discontinued; _plus is the drop-in fork)
  flutter_markdown_plus: ^1.0.12

  # QR scanning
  mobile_scanner: ^7.4.2

  # SVG rendering (file viewer's image kind)
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  ios: true
  android: false
  image_path: "icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
